openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AdaptGoal AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: openai
    description: OpenAI AI chat operations
  - name: goals
    description: Goal management
  - name: milestones
    description: Milestone tracking
  - name: prompts
    description: Daily motivational prompts
  - name: userProfile
    description: User profile and personality data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── User Profile ──────────────────────────────────────────────
  /profile:
    get:
      operationId: getProfile
      tags: [userProfile]
      summary: Get user profile (personality traits, habits, ambitions)
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: upsertProfile
      tags: [userProfile]
      summary: Create or update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  # ── Goals ─────────────────────────────────────────────────────
  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List all goals
      responses:
        "200":
          description: List of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a new goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}:
    get:
      operationId: getGoal
      tags: [goals]
      summary: Get a goal with its milestones
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Goal with milestones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalWithMilestones"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /goals/{id}/decompose:
    post:
      operationId: decomposeGoal
      tags: [goals]
      summary: AI-decompose a goal into progressive milestones (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: SSE stream of decomposition progress and created milestones
          content:
            text/event-stream: {}

  /goals/dashboard:
    get:
      operationId: getGoalsDashboard
      tags: [goals]
      summary: Get dashboard summary (completion rates, active goals, streaks)
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalsDashboard"

  # ── Milestones ────────────────────────────────────────────────
  /milestones/{id}:
    patch:
      operationId: updateMilestone
      tags: [milestones]
      summary: Update a milestone (e.g. mark complete)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneUpdate"
      responses:
        "200":
          description: Updated milestone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /goals/{id}/milestones:
    get:
      operationId: listMilestones
      tags: [milestones]
      summary: List milestones for a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of milestones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Milestone"

  # ── Daily Prompts ─────────────────────────────────────────────
  /prompts/today:
    get:
      operationId: getTodaysPrompt
      tags: [prompts]
      summary: Get today's personalized motivational prompt
      responses:
        "200":
          description: Today's prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyPrompt"

  /prompts/generate:
    post:
      operationId: generatePrompt
      tags: [prompts]
      summary: Generate a new motivational prompt via AI (SSE stream)
      responses:
        "200":
          description: SSE stream of generated prompt
          content:
            text/event-stream: {}

  /prompts:
    get:
      operationId: listPrompts
      tags: [prompts]
      summary: List recent daily prompts
      responses:
        "200":
          description: List of prompts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyPrompt"

  # ── OpenAI Conversations (onboarding chat) ────────────────────
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a message and get a streaming AI response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # ── User Profile ───────────────────────────────────────────
    UserProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        personalityTraits:
          type: array
          items:
            type: string
        habits:
          type: array
          items:
            type: string
        ambitions:
          type: array
          items:
            type: string
        motivationStyle:
          type: string
        culturalBackground:
          type: string
          description: Cultural/regional background for personalised coaching (e.g. "india", "general")
        onboardingComplete:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - personalityTraits
        - habits
        - ambitions
        - motivationStyle
        - onboardingComplete
        - createdAt
        - updatedAt

    UserProfileInput:
      type: object
      properties:
        name:
          type: string
        personalityTraits:
          type: array
          items:
            type: string
        habits:
          type: array
          items:
            type: string
        ambitions:
          type: array
          items:
            type: string
        motivationStyle:
          type: string
        culturalBackground:
          type: string
          description: Cultural/regional background for personalised coaching
        onboardingComplete:
          type: boolean
      required:
        - name

    # ── Goals ──────────────────────────────────────────────────
    Goal:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: string
        difficulty:
          type: string
        status:
          type: string
        completionRate:
          type: number
        currentStreak:
          type: integer
        totalDays:
          type: integer
        completedDays:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - category
        - difficulty
        - status
        - completionRate
        - currentStreak
        - totalDays
        - completedDays
        - createdAt
        - updatedAt

    GoalInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        category:
          type: string
        difficulty:
          type: string
      required:
        - title
        - category

    GoalUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        difficulty:
          type: string
        status:
          type: string

    GoalWithMilestones:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: string
        difficulty:
          type: string
        status:
          type: string
        completionRate:
          type: number
        currentStreak:
          type: integer
        totalDays:
          type: integer
        completedDays:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/Milestone"
      required:
        - id
        - title
        - category
        - difficulty
        - status
        - completionRate
        - currentStreak
        - totalDays
        - completedDays
        - createdAt
        - updatedAt
        - milestones

    GoalsDashboard:
      type: object
      properties:
        totalGoals:
          type: integer
        activeGoals:
          type: integer
        completedGoals:
          type: integer
        overallCompletionRate:
          type: number
        longestStreak:
          type: integer
        totalMilestones:
          type: integer
        completedMilestones:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
      required:
        - totalGoals
        - activeGoals
        - completedGoals
        - overallCompletionRate
        - longestStreak
        - totalMilestones
        - completedMilestones
        - recentActivity

    ActivityItem:
      type: object
      properties:
        type:
          type: string
        description:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
        - type
        - description
        - timestamp

    # ── Milestones ─────────────────────────────────────────────
    Milestone:
      type: object
      properties:
        id:
          type: integer
        goalId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        order:
          type: integer
        difficulty:
          type: string
        status:
          type: string
        dueDate:
          type: ["string", "null"]
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - goalId
        - title
        - order
        - difficulty
        - status
        - createdAt

    MilestoneUpdate:
      type: object
      properties:
        status:
          type: string
        title:
          type: string
        description:
          type: string
        dueDate:
          type: string

    # ── Daily Prompts ──────────────────────────────────────────
    DailyPrompt:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        goalIds:
          type: array
          items:
            type: integer
        generatedAt:
          type: string
          format: date-time
      required:
        - id
        - content
        - goalIds
        - generatedAt

    # ── OpenAI ─────────────────────────────────────────────────
    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt

    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    OpenaiMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages
